<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Applications opener</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; cursor: pointer; }
</style>

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  APPLICATIONS OPENER — 16:9, 20.0s @ 120 BPM, 24fps. F5 fixed-hero journey: one DeepGrid chip holds its
//  screen spot while five system worlds cut round it (motors, vehicles, metering, drones, every board), a
//  16th-note rush of boards, a silence, then the payoff: all five worlds ring the chip. Ends where it began.
//  Every caption is the site's own wording (app/applications-story-data.ts, sourced to the SKU Blueprint).
// =====================================================================
const ISO_DARK = true;
const FPS = 24, W = 1920, H = 1080;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 20.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 48, bottom: 48, right: 48 };
const CX = 960;
const HAND = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';   // board labels (kit/board.js reads HAND)
const HERO_AT = [1180, 560];   // the chip's fixed screen point in every world (the anchor)

// the shot list: [t0, scene, camera]
const SHOT_LIST = [
  [0.0,   'ring',    'wide'],    // flash-forward: the answer first
  [1.0,   'alone',   'wide'],    // the worlds fall away
  [2.0,   'motor',   'wide'],
  [5.0,   'vehicle', 'wide'],
  [8.0,   'meter',   'wide'],
  [11.0,  'drone',   'wide'],
  [12.0,  'drone',   'close'],   // 8ths from here
  [12.5,  'motor',   'close'],
  [13.0,  'boardA',  'close'],   // the rush: 16ths, the chip in the same spot
  [13.125,'boardB',  'close'],
  [13.25, 'boardC',  'close'],
  [13.375,'boardA',  'wide'],
  [14.5,  'alone',   'wide'],    // the silence
  [15.5,  'ring',    'wide'],    // the payoff
];
const SCENE = { ring: () => sceneRing(), alone: () => sceneAlone(), motor: () => sceneMotor(), vehicle: () => sceneVehicle(),
  meter: () => sceneMeter(), drone: () => sceneDrone(), boardA: () => sceneBoard(0), boardB: () => sceneBoard(1), boardC: () => sceneBoard(2) };
const ERA_LIST = SHOT_LIST.map(([t0, sc], i) => [t0, i + 1 < SHOT_LIST.length ? SHOT_LIST[i + 1][0] : DURATION, SCENE[sc]]);
const SHOTS = SHOT_LIST.map(([t0, sc, cam], i) => [sc + '-' + cam, i, t0, ERA_LIST[i][1], `${sc} (${cam})`]);
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'F5',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: SHOT_LIST.slice(1).map(([t0]) => t0),
  fastFrom: 13.0, fastTo: 13.5,
  morphs: [],
  anchor: { x: HERO_AT[0], y: HERO_AT[1], t0: 0, t1: DURATION },
  cues: { mainsCut: 9.4, payoff: 15.5 },
  acts: [
    { name: '1 Open',    role: 'build',   t0: 0.0,  t1: 2.0 },
    { name: '2 Worlds',  role: 'journey', t0: 2.0,  t1: 13.0 },
    { name: '3 Rush',    role: 'peak',    t0: 13.0, t1: 14.5 },
    { name: '4 Silence', role: 'turn',    t0: 14.5, t1: 15.5 },
    { name: '5 Payoff',  role: 'gift',    t0: 15.5, t1: 20.0 },
  ],
  board: [
    { t: 0.6,  title: 'flash-forward: five worlds ring the chip', sound: 'soft pad', next: 'the worlds fall away' },
    { t: 3.6,  title: 'motors and drives', sound: 'pluck groove starts', next: 'cut on the beat' },
    { t: 6.6,  title: 'vehicles: chips at the edges', sound: 'groove', next: 'cut' },
    { t: 10.0, title: 'metering: mains cut, the tamper log keeps time', sound: 'groove drops out', next: 'cut' },
    { t: 11.6, title: 'drones: the failsafe line', sound: 'build, 8ths', next: 'rush' },
    { t: 13.9, title: 'on nearly every board', sound: 'a hit on every 16th', next: 'silence' },
    { t: 15.0, title: 'the chip alone, accent off', sound: 'silence', next: 'payoff' },
    { t: 17.5, title: 'twelve architectures, five system roles', sound: 'the loudest hit', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
